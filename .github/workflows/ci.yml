name: CI

on:
  push:
    branches: [main, niklas-dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_accounting
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Object storage for the integration tests: the same S3 emulator as the
      # `storage` service of docker-compose.yml.
      s3mock:
        image: adobe/s3mock:5.2.3
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget --spider -q http://localhost:9090/favicon.ico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_accounting?schema=public
      # Integration tests provision and use their own database on the same
      # Postgres service (see tests/integration/globalSetup.ts).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_accounting_test
      # The file tests create a bucket of their own in the s3mock service
      # (see tests/integration/testStorage.ts).
      TEST_S3_ENDPOINT: http://localhost:9090
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p . --noEmit

      - name: Verify Prisma migrations apply cleanly
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Run tests (unit + integration)
        run: npm test
